# Builds Quillbinder on GitHub and publishes a release (0.50).
#
# Runs
#  - when main changes CMakeLists.txt (where the version is) or this file, and the version on main
#    has no release yet (the job "version" looks first; a Claude Code session cannot push tags, so a
#    new version on main is the usual way to a release),
#  - when a tag v<version>[-<label>] is pushed (from a computer),
#  - by hand: Actions > Release > Run workflow (the version on main, if it has no release yet).
# Everything is built from that commit in a clean Ubuntu 24.04 (the system the AppImage's libraries
# come from): both FFmpeg sets, the AppImage, the add-ons and the program update. The AppImage is
# checked end to end, the source code of every third-party library is collected, and
# tools/publish-release.sh puts it all on the Releases page (the library sources into the release
# "Third-party source code") and creates the tag v<version>-<label> if it is not there yet.
#
# 0.64.1 (the external audit's X-5): only the job "publish" may write (releases, tags); it runs no
# code that was downloaded or built, it takes the files of the job "release" as an artifact. No
# checkout keeps the token (persist-credentials: false), and the actions are pinned to commits
# (the tag each one had on 2026-11-09 in the comment).
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['CMakeLists.txt', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # only in the public repository: the private development repository carries the same file
    # (one source for both since 0.60) but never builds or publishes releases itself
    if: github.repository == 'Shelin-boop/Quillbinder_Public'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^set(APP_VERSION *"\(.*\)")/\1/p' CMakeLists.txt)
          LABEL=$(sed -n 's/^set(APP_VERSION_LABEL *"\(.*\)")/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG=$GITHUB_REF_NAME; else TAG="v$VERSION${LABEL:+-$LABEL}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # (0.60) a release without the full version gets everything built and uploaded again
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q -- '-full-.*\.AppImage$'; then
              echo "The release $TAG exists already: nothing to build."
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "The release $TAG has no full version yet: build and publish again."
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No release $TAG yet: build and publish it."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 300
    env:
      TAG: ${{ needs.version.outputs.tag }}
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools to fetch the source
        run: |
          set -o pipefail
          mkdir -p /tmp/ci-log && echo tools > /tmp/ci-log/last-step
          { apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl gh xz-utils \
            && apt-get -y -qq upgrade; } 2>&1 | tee /tmp/ci-log/tools.log

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build tools and the libraries of Ubuntu 24.04
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/ci-step.sh deb-src bash tools/enable-deb-src.sh
          tools/ci-step.sh setup bash tools/cloud-setup.sh
          tools/ci-step.sh upgrade apt-get -y -qq upgrade

      - name: FFmpeg for the media add-ons (both sets)
        run: tools/ci-step.sh ffmpeg tools/get-ffmpeg.sh

      - name: whisper.cpp for the add-on "Speech Transcription" (0.61)
        run: tools/ci-step.sh whisper tools/get-whisper.sh

      - name: AppImage
        run: tools/ci-step.sh appimage packaging/build-appimage.sh

      - name: Add-ons and program update
        env:
          QB_FFMPEG_DIR: ${{ github.workspace }}/build/ffmpeg
          QB_FFMPEG_FULL_DIR: ${{ github.workspace }}/build/ffmpeg-full
        run: |
          mkdir -p dist
          tools/ci-step.sh addons packaging/build-addons.sh build-appimage dist
          mapfile -t NEWS < <(python3 -I tools/release-notes.py --whats-new)
          BUILD=build-appimage OUT=dist tools/ci-step.sh update packaging/build-update.sh "${NEWS[@]}"
          cp build-appimage/*.AppImage dist/
          ls -la dist

      - name: Full version (the AppImage with all add-ons inside)
        run: |
          tools/ci-step.sh full packaging/build-full-appimage.sh build-appimage dist
          cp build-appimage/*-full-*.AppImage dist/

      - name: Check the AppImage
        run: tools/ci-step.sh e2e tools/e2e-appimage.sh "$(ls dist/*-x86_64.AppImage | grep -v -- -full-)" - /tmp/e2e

      - name: Check the full version
        run: tools/ci-step.sh e2e-full tools/e2e-appimage.sh "$(ls dist/*-full-*-x86_64.AppImage)" - /tmp/e2e-full

      - name: Third-party source code
        run: tools/ci-step.sh sources python3 -I tools/collect-sources.py sources

      - name: Hand the files to the job "publish"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            dist
            sources
          retention-days: 3
          if-no-files-found: error

      - name: The end of the failed step's log (as an annotation)
        if: failure()
        run: |
          s=$(cat /tmp/ci-log/last-step 2>/dev/null || echo unknown)
          f=/tmp/ci-log/$s.log
          [ -f "$f" ] || { echo "::error title=Step $s failed::no log"; exit 0; }
          msg=$(tail -n 80 "$f" | cut -c1-300 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Step $s failed::$msg"

      - name: Logs of the check
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: /tmp/e2e
          if-no-files-found: ignore

  publish:
    # the only job with write permission: it publishes what the job "release" built
    needs: [version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/ci-log
          ls -la release-files/dist
          tools/ci-step.sh publish tools/publish-release.sh "$TAG" release-files/dist release-files/sources

      - name: The end of the failed step's log (as an annotation)
        if: failure()
        run: |
          s=$(cat /tmp/ci-log/last-step 2>/dev/null || echo unknown)
          f=/tmp/ci-log/$s.log
          [ -f "$f" ] || { echo "::error title=Step $s failed::no log"; exit 0; }
          msg=$(tail -n 80 "$f" | cut -c1-300 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Step $s failed::$msg"
